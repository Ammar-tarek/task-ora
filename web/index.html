<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="CashBack Task Management">
  <meta name="theme-color" content="#0F172A">

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CashBack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CashBack</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      height: 100%;
      height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    
    flt-glass-pane, flutter-view, canvas, flt-scene-host {
      touch-action: manipulation !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
      overscroll-behavior: none !important;
    }

    input, textarea, select, [contenteditable="true"] {
      -webkit-user-select: text !important;
      user-select: text !important;
      touch-action: auto !important;
    }

    .loading-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      pointer-events: none;
      background-color: #0F172A;
      transition: opacity 0.4s ease;
    }
    .app-logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      animation: pulse 2s infinite ease-in-out;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    .loading-text {
      color: #E2E8F0;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <img class="app-logo" src="icons/Icon-192.png" alt="CashBack Logo">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading CashBack...</div>
  </div>

  <script>
    // WebGL context-loss recovery. iOS Safari (WebKit) can drop the CanvasKit
    // WebGL context under memory pressure; without recovery the canvas stays
    // frozen and touch is dead. Strategy:
    //   1. preventDefault() so the browser is ALLOWED to restore the context.
    //   2. Wait briefly for a 'webglcontextrestored' event.
    //   3. If it doesn't restore, reload ONCE (guarded via sessionStorage so we
    //      never enter a reload loop).
    // NOTE: capture phase (true) — 'webglcontextlost' does NOT bubble, so a
    // bubble-phase window listener would never fire.
    (function () {
      var RESTORE_WAIT_MS = 2000;   // grace period for the browser to restore
      var RELOAD_GUARD_MS = 30000;  // at most one recovery reload per 30s
      var lostTimer = null;

      function canReloadNow() {
        try {
          var last = parseInt(sessionStorage.getItem('webglReloadAt') || '0', 10);
          return (Date.now() - last) > RELOAD_GUARD_MS;
        } catch (e) { return true; }
      }
      function markReloaded() {
        try { sessionStorage.setItem('webglReloadAt', String(Date.now())); } catch (e) {}
      }

      window.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
        console.warn('[WebGL] context lost — awaiting restore…');
        if (lostTimer) clearTimeout(lostTimer);
        lostTimer = setTimeout(function () {
          if (canReloadNow()) {
            markReloaded();
            console.warn('[WebGL] not restored — reloading once to recover.');
            window.location.reload();
          } else {
            console.warn('[WebGL] still lost; reload suppressed by guard.');
          }
        }, RESTORE_WAIT_MS);
      }, true);

      window.addEventListener('webglcontextrestored', function () {
        console.debug('[WebGL] context restored.');
        if (lostTimer) { clearTimeout(lostTimer); lostTimer = null; }
      }, true);
    })();

    window.addEventListener('load', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        setTimeout(function() {
          loading.style.opacity = '0';
          setTimeout(function() {
            if (loading.parentNode) {
              loading.parentNode.removeChild(loading);
            }
          }, 400);
        }, 800);
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(function(err) {
          console.log('FCM Service Worker registration failed: ', err);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
