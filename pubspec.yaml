name: task_ora
description: "CashBack Operations Dashboard"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  fl_chart: ^0.68.0
  intl: ^0.20.2
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.3.1

  # Printing & PDF Export
  pdf: ^3.11.1
  printing: ^5.13.2

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.16.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4

  # State management
  provider: ^6.1.2

  # n8n / webhook integration
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # WiFi auto-attendance
  connectivity_plus: ^6.1.5
  network_info_plus: ^6.1.4

  # Auto update & APK download
  background_downloader: ^8.5.0
  open_filex: ^4.5.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # Android adaptive icon: solid white background, transparent foreground logo.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/logo.png
